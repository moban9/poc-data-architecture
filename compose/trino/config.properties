#single node install config
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
cache-manager.config-files=etc/cache-manager-memory.properties

# ── Batch query memory (keel, kanban t_df6a7bb7, 2026-11-05) ────────────────
# Everything above is the trinodb/trino image default, copied verbatim so this
# mount changes nothing but the limits below.
#
# WHY: the default per-node query memory is 0.3 x Xmx = 921.6MB on the 3GB heap.
# The Silver dedupe of bronze.repayment_schedule (14.3M-row changelog, 6.9M ids,
# dbt/macros/latest_cdc_row.sql) peaks at ~900MB in its TopNRankingOperator plus
# a local exchange, and died with
#   EXCEEDED_LOCAL_MEMORY_LIMIT: per-node memory limit of 921.60MB
#   [Top Consumers: {TopNRankingOperator=776.72MB, LocalExchange=123.68MB}]
# on a single node — twice, including with dbt --threads 1.
#
# 1.5GB per query / 2GB total fits inside the existing 3GB heap and 4GB
# container limit: no resize, no extra spend, no change to the VM shape. The
# dedupe needs ~900MB, so this leaves ~600MB of headroom and still bounds a
# runaway query well below the heap.
#
# Heavy dbt builds must run with --threads 1: this is one node, and every
# concurrent model query draws from the same per-node budget.
query.max-memory-per-node=1536MB
