# Trino -> Apache Polaris (Iceberg REST catalog) -> MinIO (S3).
#
# The Trino CATALOG name is this file's basename: `lakehouse`
# (matches dbt/profiles.yml.example `catalog: lakehouse`), so SQL is:
#     SELECT ... FROM lakehouse.<namespace>.<table>
#
# Every value is env-parameterized via Trino's ${ENV:...} substitution;
# docker-compose.yml injects the vars into the trino container from
# compose/.env. See README.md next to this file for the env contract.

connector.name=iceberg
iceberg.catalog.type=rest

# Polaris REST endpoint (Iceberg REST base path).
iceberg.rest-catalog.uri=${ENV:POLARIS_URI}

# Polaris catalog to resolve within the REST API. This is the catalog defined
# on the Polaris side (created by compose/polaris/init-lakehouse.sh).
iceberg.rest-catalog.warehouse=${ENV:POLARIS_WAREHOUSE}

# Auth against Polaris: OAuth2 client-credentials (bootstrap root principal).
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CLIENT_ID}:${ENV:POLARIS_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL

# Route REST requests to the correct Polaris realm.
iceberg.rest-catalog.http-headers=Polaris-Realm: ${ENV:POLARIS_REALM}

# Let Polaris vend MinIO (S3) credentials to Trino — no static S3 keys here.
iceberg.rest-catalog.vended-credentials-enabled=true

# Native S3 filesystem pointed at MinIO.
# (Trino's native S3 flag; the older name is fs.native-s3.enabled.)
fs.s3.enabled=true
s3.endpoint=${ENV:MINIO_ENDPOINT}
s3.path-style-access=true
s3.region=${ENV:MINIO_REGION}
