# Traefik routing (dynamic) configuration — loaded by the file provider declared
# in traefik.yml. Every router/service is declared explicitly (no docker provider).
#
# Host rules use Go templating to inject the base domain:
#   {{ default "onendo.cloud" (env "DOMAIN") }}   → reads the DOMAIN env var (set on the
#                                         traefik container), falling back to
#                                         onendo.cloud.
http:
  routers:
    grafana:
      entryPoints: [web]
      rule: 'Host(`grafana.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: grafana
    demo:
      entryPoints: [web]
      rule: 'Host(`demo.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: demo
    bi:
      entryPoints: [web]
      rule: 'Host(`bi.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: metabase
    plane:
      entryPoints: [web]
      rule: 'Host(`plane.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: plane-web
    plane-api:
      entryPoints: [web]
      rule: 'Host(`plane.{{ default "onendo.cloud" (env "DOMAIN") }}`) && (PathPrefix(`/api`) || PathPrefix(`/auth`))'
      service: plane-backend
    plane-admin:
      entryPoints: [web]
      rule: 'Host(`plane.{{ default "onendo.cloud" (env "DOMAIN") }}`) && PathPrefix(`/god-mode`)'
      service: plane-admin
    trino:
      entryPoints: [web]
      rule: 'Host(`trino.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: trino
    polaris:
      entryPoints: [web]
      rule: 'Host(`polaris.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: polaris
    minio:
      entryPoints: [web]
      rule: 'Host(`minio.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: minio
    connect:
      entryPoints: [web]
      rule: 'Host(`connect.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: connect
    lms:
      entryPoints: [web]
      rule: 'Host(`lms.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: lms
    prometheus:
      entryPoints: [web]
      rule: 'Host(`prometheus.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: prometheus
    alertmanager:
      entryPoints: [web]
      rule: 'Host(`alertmanager.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: alertmanager
    pushgateway:
      entryPoints: [web]
      rule: 'Host(`pushgateway.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: pushgateway
    # Dagster UI (orchestrator). NOTE: reachable over HTTPS only once the
    # Google-managed cert's SAN list includes dagster.<DOMAIN> (terraform
    # network module); until then use http://<vm-ip>:3001.
    dagster:
      entryPoints: [web]
      rule: 'Host(`dagster.{{ default "onendo.cloud" (env "DOMAIN") }}`)'
      service: dagster

  services:
    grafana:
      loadBalancer:
        servers:
          - url: http://grafana:3000
    demo:
      loadBalancer:
        servers:
          - url: http://demo:8000
    metabase:
      loadBalancer:
        servers:
          - url: http://metabase:3000
    plane-web:
      loadBalancer:
        servers:
          - url: http://plane-web:3000
    plane-backend:
      loadBalancer:
        servers:
          - url: http://plane:8000
    plane-admin:
      loadBalancer:
        servers:
          - url: http://plane-admin:3000
    trino:
      loadBalancer:
        servers:
          - url: http://trino:8080
    polaris:
      loadBalancer:
        servers:
          - url: http://polaris:8181
    minio:
      loadBalancer:
        servers:
          - url: http://minio:9000
    connect:
      loadBalancer:
        servers:
          - url: http://connect:8083
    lms:
      loadBalancer:
        servers:
          - url: http://lms-api:8000
    prometheus:
      loadBalancer:
        servers:
          - url: http://prometheus:9090
    alertmanager:
      loadBalancer:
        servers:
          - url: http://alertmanager:9093
    pushgateway:
      loadBalancer:
        servers:
          - url: http://pushgateway:9091
    dagster:
      loadBalancer:
        servers:
          - url: http://dagster:3000
