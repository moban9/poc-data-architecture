# Full POC stack — pinned to 05 §9 component budget (8 vCPU / 16 GB / 100 GB, single node).
# Placeholders marked "TODO(team)" are owned: LMS api/seed = Piston, connector configs = Cask,
# dbt project + trino catalogs = Meridian, polaris props = Meridian, monitoring = Relay.
name: lms-poc

x-jvm-logging: &jvm-logging
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Djava.util.logging.config.file=/dev/null"

services:
  # ── Source: Loan Management System ─────────────────────────────────────────
  lms-postgres:
    restart: unless-stopped
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: ${LMS_DB_USER:-lms}
      POSTGRES_PASSWORD: ${LMS_DB_PASSWORD:-lms}
      POSTGRES_DB: ${LMS_DB_NAME:-lms}
    ports:
    - "5432:5432"
    command: >
      postgres -c wal_level=logical -c max_replication_slots=4
               -c max_wal_senders=4 -c shared_preload_libraries=pgoutput
               -c shared_buffers=2GB -c effective_cache_size=8GB
               -c work_mem=64MB -c maintenance_work_mem=512MB
               -c max_wal_size=4GB -c checkpoint_timeout=15min
    # 384m/128MB shared_buffers made the /generate COPY crawl: every index
    # insert on a multi-million-row repayment_schedule missed the 128MB cache
    # (~4s per 1000-loan batch). 3g/2GB buffers keeps the hot indexes resident.
    mem_limit: 3g
    cpus: 2.0
    volumes:
    - lms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LMS_DB_USER:-lms}"]
      interval: 10s
      timeout: 5s
      retries: 10

  lms-api:
    restart: unless-stopped
    # TODO(Piston): FastAPI service + deterministic seed generator (02 doc).
    build: ../src/lms
    environment:
      DATABASE_URL: postgresql://${LMS_DB_USER:-lms}:${LMS_DB_PASSWORD:-lms}@lms-postgres:5432/${LMS_DB_NAME:-lms}
      LMS_TIMING: "1"   # structured /generate phase timing on stderr (perf work)
    ports:
    - "8000:8000"
    depends_on:
    - lms-postgres
    mem_limit: 512m
    # 10k-loan /generate is ~4ms/loan of CPU; at 0.5 CPU that exceeded the
    # demo LB's 30s SSE timeout (measured 41s on lms-poc-vm). 2.0 keeps it ~12s.
    cpus: 2.0

  # Demo control panel (FastAPI) — drives the pipeline scenarios. Served by the
  # Traefik edge layer at demo.<DOMAIN>; not published to the host.
  demo:
    restart: unless-stopped
    build: ../demo
    environment:
      # Point at the real stack by service name; unreachable → simulated.
      LMS_API_URL: http://lms-api:8000
      KAFKA_CONNECT_URL: http://connect:8083
      TRINO_URL: http://trino:8080
      METABASE_URL: http://metabase:3000
      DAGSTER_URL: http://dagster:3000
      # Real ticket creation needs all five: the URL, an API key, the workspace
      # slug and the project id. Only the URLs used to be passed through here,
      # so a populated compose/.env still left the container unable to ticket
      # (PLANE_API_KEY/WORKSPACE/PROJECT_ID were empty *inside* the demo).
      PLANE_API_URL: ${PLANE_API_URL:-http://plane:8000/api/v1}
      PLANE_UI_URL: ${PLANE_UI_URL:-http://localhost:3010}
      PLANE_API_KEY: ${PLANE_API_KEY:-}
      PLANE_WORKSPACE: ${PLANE_WORKSPACE:-}
      PLANE_PROJECT_ID: ${PLANE_PROJECT_ID:-}
      PUSHGATEWAY_URL: ${PUSHGATEWAY_URL:-http://pushgateway:9091}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      KILLSWITCH_URL: ${KILLSWITCH_URL:-http://demo-killswitch:8002}
    # Fallback path when Plane runs as its own compose project (its `plane`
    # service then is NOT resolvable from the lms-poc network — that shows up as
    # the panel reporting plane reachable:false). Point PLANE_API_URL at
    # http://host.docker.internal:8010/api/v1 in that case.
    extra_hosts:
    - "host.docker.internal:host-gateway"
    expose:
    - "8000"
    depends_on:
    - lms-api
    mem_limit: 256m
    cpus: 0.25

  # Demo kill-switch — narrowly-scoped, reversible control of the pipeline for
  # the failure/incident demo scenarios. Talks to the HOST docker daemon through
  # the mounted socket and runs ONLY the allowlisted commands in
  # demo/killswitch.py (docker stop/start the MinIO object store, run the dbt
  # pipeline by exec-ing into the dbt-runner container). No arbitrary commands.
  demo-killswitch:
    restart: unless-stopped
    build:
      context: ../demo
      dockerfile: Dockerfile.killswitch
    environment:
      ICEBERG_SINK_CONTAINER: ${ICEBERG_SINK_CONTAINER:-lms-monitoring-minio-1}
      # Container that already has dbt + the mounted dbt project + network DNS.
      DBT_RUNNER_CONTAINER: ${DBT_RUNNER_CONTAINER:-lms-monitoring-dagster-1}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    expose:
    - "8002"
    mem_limit: 128m
    cpus: 0.25

  # ── Lakehouse: object storage + catalog ────────────────────────────────────
  minio:
    restart: unless-stopped
    image: ${MINIO_IMAGE:-adobe/s3mock:latest}
    command: ["--http.port=9000"]
    environment:
      # s3mock 3.x reads these exact vars (the generic `root`/`initialBuckets`
      # envs are ignored). The store root MUST be /s3mockroot (named volume) and
      # RETAIN_FILES_ON_EXIT=true so data survives container restarts.
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
    - "9000:9000"
    mem_limit: 512m
    cpus: 0.5
    volumes:
    - minio_data:/s3mockroot

  polaris-postgres:
    restart: unless-stopped
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: ${POLARIS_DB_USER:-polaris}
      POSTGRES_PASSWORD: ${POLARIS_DB_PASSWORD:-polaris}
      POSTGRES_DB: ${POLARIS_DB_NAME:-polaris}
    ports:
    - "5433:5432"
    mem_limit: 256m
    cpus: 0.25
    volumes:
    - polaris_pg_data:/var/lib/postgresql/data

  polaris:
    restart: unless-stopped
    image: ${POLARIS_IMAGE:-apache/polaris:latest}
    environment:
      # Realm + bootstrap root principal (format: <realm>,<client_id>,<client_secret>).
      polaris.realm-context.realms: ${POLARIS_REALM:-POLARIS}
      POLARIS_BOOTSTRAP_CREDENTIALS: ${POLARIS_REALM:-POLARIS},${POLARIS_CLIENT_ID:-root},${POLARIS_CLIENT_SECRET:-CHANGE_ME_polaris_root}
      # Static MinIO (S3) credentials — used by Polaris and vended to Trino.
      AWS_REGION: ${MINIO_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-CHANGE_ME_minio}
      # Catalog metadata goes to polaris-postgres. The default is an IN-MEMORY
      # metastore: every Polaris restart wiped the `lakehouse` catalog, its
      # namespaces and every bronze table registration. currentSchema=public is
      # required, otherwise the DDL bootstrap fails with "no schema has been
      # selected to create in".
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_AUTO_BOOTSTRAP_TYPES: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-postgres:5432/polaris?currentSchema=public
      QUARKUS_DATASOURCE_USERNAME: ${POLARIS_DB_USER:-polaris}
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD:-polaris}
      # Persisted RSA token-signing keys (./polaris/keys, generated by
      # polaris/generate-keys.sh). Without them Polaris generates a NEW keypair
      # at every boot, so already-issued JWTs stop verifying and Trino/dbt/the
      # Iceberg sink all get 401 "Failed to verify token" until they re-auth.
      # NB: these must be -D system properties. The equivalent
      # POLARIS_AUTHENTICATION_TOKEN_BROKER_* env vars do NOT bind to
      # polaris.authentication.token-broker.* (that config is a
      # @WithUnnamedKey map), and fail silently.
      JAVA_TOOL_OPTIONS: "-Xmx768m -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7074:/opt/jmx/polaris.yml -Dpolaris.authentication.token-broker.type=rsa-key-pair -Dpolaris.authentication.token-broker.rsa-key-pair.private-key-file=/keys/private.pem -Dpolaris.authentication.token-broker.rsa-key-pair.public-key-file=/keys/public.pem"
    ports:
    - "8181:8181"
    depends_on:
    - polaris-postgres
    # 512m OOM-killed Polaris under concurrent dbt/Iceberg-sink catalog load
    # (container oom events, exit 0 + restart loop).
    mem_limit: 1g
    cpus: 1.0
    volumes:
    - ../monitoring/jmx:/opt/jmx:ro
    - ./polaris/keys:/keys:ro   # persisted JWT signing keys (see generate-keys.sh)

  # One-shot: create the Polaris `lakehouse` catalog (Iceberg REST). See
  # polaris/init-lakehouse.sh.
  polaris-setup:
    image: ${POLARIS_SETUP_IMAGE:-alpine/curl:latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
    - >
      apk add --no-cache jq >/dev/null &&
      sh /polaris/init-lakehouse.sh
    environment:
      POLARIS_HOST: ${POLARIS_HOST:-http://polaris:8181}
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-CHANGE_ME_polaris_root}
      POLARIS_WAREHOUSE: ${POLARIS_WAREHOUSE:-lakehouse}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-CHANGE_ME_minio}
    volumes:
    - ./polaris:/polaris:ro
    depends_on:
      minio:
        condition: service_started
      polaris:
        condition: service_started
    restart: "no"

  # ── Streaming: Kafka (KRaft) + Connect ─────────────────────────────────────
  kafka:
    restart: unless-stopped
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.1}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      JAVA_TOOL_OPTIONS: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7071:/opt/jmx/kafka.yml"
    ports:
    - "9092:9092"
    mem_limit: 1536m
    cpus: 1.0
    volumes:
    - kafka_data:/var/lib/kafka/data
    - ../monitoring/jmx:/opt/jmx:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  connect:
    restart: unless-stopped
    image: ${CONNECT_IMAGE:-debezium/connect:2.7.3.Final}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: lms-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      <<: *jvm-logging
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Djava.util.logging.config.file=/dev/null -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7072:/opt/jmx/connect.yml"
    ports:
    - "8083:8083"
    depends_on:
    - kafka
    volumes:
    - connect_config:/kafka/config
    - connect_data:/kafka/data
    - connect_logs:/kafka/logs
    - ./connect-plugins:/kafka/connect/iceberg-sink
    - ../monitoring/jmx:/opt/jmx:ro
    # 1536m OOM-killed the worker while draining the POC backlog (Debezium +
    # iceberg-sink + 11 connectors on the plugin path); 4g with
    # MaxRAMPercentage=75 gives a 3 GB heap.
    mem_limit: 4g
    cpus: 2.0

  # One-shot: RECONCILE the Debezium source + Iceberg sink connector configs with
  # Kafka Connect. Runs on every `up -d`, so a VM reboot re-registers the
  # connectors regardless of Kafka config-topic state — but it only PUTs a
  # connector whose rendered config actually differs from the stored one
  # (GET + key diff). Blind re-PUTs used to restart the sink task on every
  # deploy, and a restarted sink replays its uncommitted Kafka window; the
  # append-only sink writes that replay as duplicate rows (docs/09). Only a
  # real config change should ever cause a restart.
  # FORCE_REGISTER=1 restores the old always-PUT behaviour.
  register-connectors:
    image: ${POLARIS_SETUP_IMAGE:-alpine/curl:latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
    - >
      apk add --no-cache bash gettext jq >/dev/null &&
      bash /connectors/register-connectors.sh
    environment:
      CONNECT_URL: http://connect:8083
      FORCE_REGISTER: ${FORCE_REGISTER:-0}
      WAIT_FOR_RUNNING: ${WAIT_FOR_RUNNING:-1}
      LMS_DB_HOST: lms-postgres
      LMS_DB_PORT: "5432"
      LMS_DB_USER: ${LMS_DB_USER:-lms}
      LMS_DB_PASSWORD: ${LMS_DB_PASSWORD:-lms}
      LMS_DB_NAME: ${LMS_DB_NAME:-lms}
      LMS_TOPIC_PREFIX: ${LMS_TOPIC_PREFIX:-lms}
      DBZ_TABLE_INCLUDE_LIST: ${DBZ_TABLE_INCLUDE_LIST:-public.loan,public.loan_event,public.borrower,public.repayment_schedule}
      DBZ_SLOT_NAME: ${DBZ_SLOT_NAME:-lms_poc_debezium}
      DBZ_PUBLICATION_NAME: ${DBZ_PUBLICATION_NAME:-lms_poc_publication}
      # no_data: a connector recreate must never re-emit table history (docs/09).
      SNAPSHOT_MODE: ${SNAPSHOT_MODE:-no_data}
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:-http://polaris:8181/api/catalog}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-lakehouse}
      ICEBERG_TABLES: ${ICEBERG_TABLES:-bronze.loan,bronze.loan_event,bronze.borrower,bronze.repayment_schedule}
      SINK_TOPICS_REGEX: ${SINK_TOPICS_REGEX:-lms.public.*}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_minio}
      MINIO_PATH_STYLE: ${MINIO_PATH_STYLE:-true}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      POLARIS_CREDENTIAL: ${POLARIS_CREDENTIAL:-root:CHANGE_ME_polaris_root}
      POLARIS_SCOPE: ${POLARIS_SCOPE:-PRINCIPAL_ROLE:ALL}
    volumes:
    - ./connectors:/connectors:ro
    depends_on:
      connect:
        condition: service_started
      minio:
        condition: service_started
      polaris-setup:
        condition: service_completed_successfully
    restart: "no"

  # ── Compute / transform / serve ────────────────────────────────────────────
  trino:
    restart: unless-stopped
    image: ${TRINO_IMAGE:-trinodb/trino:latest}
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx3g -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7073:/opt/jmx/trino.yml"
      # Injected into etc/catalog/lakehouse.properties via ${ENV:...} (see
      # trino/catalog/README.md for the full env contract).
      POLARIS_URI: ${POLARIS_URI:-http://polaris:8181/api/catalog}
      POLARIS_WAREHOUSE: ${POLARIS_WAREHOUSE:-lakehouse}
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-CHANGE_ME_polaris_root}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-CHANGE_ME_minio}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    ports:
    - "8080:8080"
    mem_limit: 4g
    cpus: 2.0
    volumes:
      # Filename = Trino catalog name: lakehouse.properties (Polaris REST catalog).
      # etc/catalog/postgres.properties (LMS) still TODO.
    - ./trino/catalog:/etc/trino/catalog:ro
    # Batch query memory: the image default allows only 0.3 x Xmx = 921MB per
    # node, which the 6.9M-id Silver dedupe exceeds (docs/09 §6.1). Mounting the
    # whole file is required — Trino has no include/config-override mechanism.
    - ./trino/config.properties:/etc/trino/config.properties:ro
    - ./demo:/demo:ro
    - ../monitoring/jmx:/opt/jmx:ro
    depends_on:
      minio:
        condition: service_started
      polaris:
        condition: service_started
      polaris-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # One-shot: run the dbt medallion pipeline (seed + silver + gold) against
  # Trino and push the results (dbt_run_success, dbt_test_failures,
  # quarantine_rows_total) to the pushgateway so Grafana's Bronze/Silver/Gold
  # stages + DQ panels light up. Re-run it any time with:
  #   docker compose up -d --force-recreate dbt
  # (or `docker compose run --rm dbt`). The on-run-end hook + per-rule
  # quarantine models isolate dirty rows; dbt test is EXPECTED to report the
  # failures it catches (see dbt/README.md).
  dbt:
    image: ${DBT_IMAGE:-onendo-dbt:latest}
    build:
      context: ../dbt
      dockerfile: dbt.Dockerfile
    working_dir: /dbt
    entrypoint: ["/bin/sh", "-c"]
    command: ["sh scripts/run-and-push-metrics.sh"]
    environment:
      DBT_PROFILES_DIR: /dbt
      TRINO_HOST: trino
      PUSHGATEWAY_URL: http://pushgateway:9091
    volumes:
      - ../dbt:/dbt
    depends_on:
      trino:
        condition: service_healthy
    restart: "no"

  # ── Orchestration: Dagster owns the dbt run ────────────────────────────────
  # Replaces the 2-minute cron on the VM (`scripts/dbt-schedule.sh` → `docker
  # compose run --rm dbt`) with a scheduled Dagster job. ADDITIVE for now: the
  # `dbt` one-shot service above and the cron are left in place until the
  # schedule is observed firing twice in the UI, then the cron line is dropped.
  #
  # UI:      http://<vm>:${DAGSTER_HOST_PORT:-3001}   (container port 3000)
  #          Host port 3000 is taken by Grafana, so the UI is published on 3001
  #          and also routed at http://dagster.<DOMAIN> via Traefik.
  # Storage: Dagster's own Postgres (run history / schedule ticks) so the Runs
  #          tab survives container rebuilds.
  dagster-postgres:
    restart: unless-stopped
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USER:-dagster}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD:-CHANGE_ME_dagster}
      POSTGRES_DB: ${DAGSTER_PG_DB:-dagster}
    mem_limit: 256m
    cpus: 0.25
    volumes:
      - dagster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DAGSTER_PG_USER:-dagster} -d ${DAGSTER_PG_DB:-dagster}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Webserver (UI + GraphQL). Named `dagster` on purpose: the demo panel already
  # probes DAGSTER_URL=http://dagster:3000 and Traefik targets the same name.
  dagster:
    restart: unless-stopped
    build:
      context: ../dagster
      dockerfile: Dockerfile
    image: ${DAGSTER_IMAGE:-onendo-dagster:latest}
    command:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -w
      - /opt/dagster/dagster_home/workspace.yaml
    environment: &dagster-env
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_PG_HOST: dagster-postgres
      DAGSTER_PG_PORT: "5432"
      DAGSTER_PG_USER: ${DAGSTER_PG_USER:-dagster}
      DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:-CHANGE_ME_dagster}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      # dbt execution context — identical to the one-shot `dbt` service above.
      DBT_PROJECT_DIR: /dbt
      DBT_PROFILES_DIR: /dbt
      TRINO_HOST: trino
      PUSHGATEWAY_URL: http://pushgateway:9091
      DAGSTER_DBT_CRON: ${DAGSTER_DBT_CRON:-*/2 * * * *}
    ports:
      # Host 3000 belongs to Grafana; 3001 is free on the POC node.
      - "${DAGSTER_HOST_PORT:-3001}:3000"
    volumes:
      # RW: dbt writes target/ (run_results.json) and logs/ in place, exactly
      # like the one-shot service.
      - ../dbt:/dbt
    depends_on:
      dagster-postgres:
        condition: service_healthy
      trino:
        condition: service_healthy
    mem_limit: 1g
    cpus: 0.5
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Daemon: ticks the schedule (a schedule with no daemon never fires) and
  # launches runs. Same image, same code location, same dbt mount.
  dagster-daemon:
    restart: unless-stopped
    build:
      context: ../dagster
      dockerfile: Dockerfile
    image: ${DAGSTER_IMAGE:-onendo-dagster:latest}
    command:
      - dagster-daemon
      - run
      - -w
      - /opt/dagster/dagster_home/workspace.yaml
    environment: *dagster-env
    volumes:
      - ../dbt:/dbt
    depends_on:
      dagster-postgres:
        condition: service_healthy
      dagster:
        condition: service_started
      trino:
        condition: service_healthy
    mem_limit: 768m
    cpus: 0.5

  # Ad-hoc engine for the data-virtualization demo (profiles: demo).
  # Run it:  docker compose run --rm duckdb
  duckdb:
    restart: unless-stopped
    image: ${DUCKDB_IMAGE:-duckdb/duckdb:latest}
    profiles: ["demo"]
    volumes:
    - ./demo:/demo
    working_dir: /demo
    mem_limit: 512m
    cpus: 0.5

  # ── BI ─────────────────────────────────────────────────────────────────────
  metabase:
    restart: unless-stopped
    image: ${METABASE_IMAGE:-metabase/metabase:latest}
    environment:
      MB_JETTY_PORT: 3000
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TOOL_OPTIONS: "-Xmx1280m"
      # Freshness: the demo injects data and expects dashboards to reflect it
      # quickly, so disable result caching (Trino is local; load is negligible).
      MB_ENABLE_QUERY_CACHING: "false"
    ports:
      - "8085:3000"
    mem_limit: 2g
    cpus: 0.5
    volumes:
    - metabase_data:/metabase-data
    depends_on:
    - trino

  # ── Monitoring ─────────────────────────────────────────────────────────────
  node-exporter:
    restart: unless-stopped
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:latest}
    ports:
    - "9100:9100"
    mem_limit: 128m
    cpus: 0.25
    # TODO(Relay): add JMX exporters (Kafka, Connect, Trino, Polaris) as java
    # agents via JAVA_TOOL_OPTIONS on each JVM, plus MinIO + Postgres exporters.
    # Configs under monitoring/jmx/.

networks:
  default:
    name: lms-poc

volumes:
  lms_pg_data:
  polaris_pg_data:
  minio_data:
  kafka_data:
  connect_config:
  connect_data:
  connect_logs:
  metabase_data:
  dagster_pg_data:
  prometheus_data:
  grafana_data:
