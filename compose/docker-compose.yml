# Full POC stack — pinned to 05 §9 component budget (8 vCPU / 16 GB / 100 GB, single node).
# Placeholders marked "TODO(team)" are owned: LMS api/seed = Piston, connector configs = Cask,
# dbt project + trino catalogs = Meridian, polaris props = Meridian, monitoring = Relay.
name: lms-poc

x-jvm-logging: &jvm-logging
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Djava.util.logging.config.file=/dev/null"

services:
  # ── Source: Loan Management System ─────────────────────────────────────────
  lms-postgres:
    restart: unless-stopped
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: ${LMS_DB_USER:-lms}
      POSTGRES_PASSWORD: ${LMS_DB_PASSWORD:-lms}
      POSTGRES_DB: ${LMS_DB_NAME:-lms}
    ports:
    - "5432:5432"
    command: >
      postgres -c wal_level=logical -c max_replication_slots=4
               -c max_wal_senders=4 -c shared_preload_libraries=pgoutput
    mem_limit: 384m
    cpus: 0.5
    volumes:
    - lms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LMS_DB_USER:-lms}"]
      interval: 10s
      timeout: 5s
      retries: 10

  lms-api:
    restart: unless-stopped
    # TODO(Piston): FastAPI service + deterministic seed generator (02 doc).
    build: ../src/lms
    environment:
      DATABASE_URL: postgresql://${LMS_DB_USER:-lms}:${LMS_DB_PASSWORD:-lms}@lms-postgres:5432/${LMS_DB_NAME:-lms}
    ports:
    - "8000:8000"
    depends_on:
    - lms-postgres
    mem_limit: 512m
    cpus: 0.5

  # Demo control panel (FastAPI) — drives the pipeline scenarios. Served by the
  # Traefik edge layer at demo.<DOMAIN>; not published to the host.
  demo:
    restart: unless-stopped
    build: ../demo
    environment:
      # Point at the real stack by service name; unreachable → simulated.
      LMS_API_URL: http://lms-api:8000
      KAFKA_CONNECT_URL: http://connect:8083
      TRINO_URL: http://trino:8080
      METABASE_URL: http://metabase:3000
      DAGSTER_URL: http://dagster:3000
      PLANE_API_URL: ${PLANE_API_URL:-http://plane:8000/api/v1}
      PLANE_UI_URL: ${PLANE_UI_URL:-http://plane-web:80}
    expose:
    - "8000"
    depends_on:
    - lms-api
    mem_limit: 256m
    cpus: 0.25

  # ── Lakehouse: object storage + catalog ────────────────────────────────────
  minio:
    restart: unless-stopped
    image: ${MINIO_IMAGE:-adobe/s3mock:latest}
    command: ["--http.port=9000"]
    environment:
      initialBuckets: ${MINIO_BUCKET:-lakehouse}
      root: /s3mockroot
    ports:
    - "9000:9000"
    mem_limit: 512m
    cpus: 0.5
    volumes:
    - minio_data:/s3mockroot

  polaris-postgres:
    restart: unless-stopped
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: ${POLARIS_DB_USER:-polaris}
      POSTGRES_PASSWORD: ${POLARIS_DB_PASSWORD:-polaris}
      POSTGRES_DB: ${POLARIS_DB_NAME:-polaris}
    ports:
    - "5433:5432"
    mem_limit: 256m
    cpus: 0.25
    volumes:
    - polaris_pg_data:/var/lib/postgresql/data

  polaris:
    restart: unless-stopped
    image: ${POLARIS_IMAGE:-apache/polaris:latest}
    environment:
      # Realm + bootstrap root principal (format: <realm>,<client_id>,<client_secret>).
      polaris.realm-context.realms: ${POLARIS_REALM:-POLARIS}
      POLARIS_BOOTSTRAP_CREDENTIALS: ${POLARIS_REALM:-POLARIS},${POLARIS_CLIENT_ID:-root},${POLARIS_CLIENT_SECRET:-CHANGE_ME_polaris_root}
      # Static MinIO (S3) credentials — used by Polaris and vended to Trino.
      AWS_REGION: ${MINIO_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-CHANGE_ME_minio}
      JAVA_TOOL_OPTIONS: "-Xmx384m -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7074:/opt/jmx/polaris.yml"
    ports:
    - "8181:8181"
    depends_on:
    - polaris-postgres
    mem_limit: 512m
    cpus: 0.5
    volumes:
    - ../monitoring/jmx:/opt/jmx:ro

  # One-shot: create the Polaris `lakehouse` catalog (Iceberg REST). See
  # polaris/init-lakehouse.sh.
  polaris-setup:
    image: ${POLARIS_SETUP_IMAGE:-alpine/curl:latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
    - >
      apk add --no-cache jq >/dev/null &&
      sh /polaris/init-lakehouse.sh
    environment:
      POLARIS_HOST: ${POLARIS_HOST:-http://polaris:8181}
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-CHANGE_ME_polaris_root}
      POLARIS_WAREHOUSE: ${POLARIS_WAREHOUSE:-lakehouse}
      MINIO_BUCKET: ${MINIO_BUCKET:-lakehouse}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-CHANGE_ME_minio}
    volumes:
    - ./polaris:/polaris:ro
    depends_on:
      minio:
        condition: service_started
      polaris:
        condition: service_started
    restart: "no"

  # ── Streaming: Kafka (KRaft) + Connect ─────────────────────────────────────
  kafka:
    restart: unless-stopped
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.1}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      JAVA_TOOL_OPTIONS: "-javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7071:/opt/jmx/kafka.yml"
    ports:
    - "9092:9092"
    mem_limit: 1536m
    cpus: 1.0
    volumes:
    - kafka_data:/var/lib/kafka/data
    - ../monitoring/jmx:/opt/jmx:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  connect:
    restart: unless-stopped
    image: ${CONNECT_IMAGE:-debezium/connect:2.7.3.Final}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: lms-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      <<: *jvm-logging
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Djava.util.logging.config.file=/dev/null -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7072:/opt/jmx/connect.yml"
    ports:
    - "8083:8083"
    depends_on:
    - kafka
    volumes:
    - connect_config:/kafka/config
    - connect_data:/kafka/data
    - connect_logs:/kafka/logs
    - ./connect-plugins:/kafka/connect/iceberg-sink
    - ../monitoring/jmx:/opt/jmx:ro
    mem_limit: 1536m
    cpus: 1.0

  # One-shot: (re-)register the Debezium source + Iceberg sink connectors with
  # Kafka Connect (idempotent PUT upsert). Re-runs on every `up -d`, so a VM
  # reboot re-registers the connectors regardless of Kafka config-topic state.
  register-connectors:
    image: ${POLARIS_SETUP_IMAGE:-alpine/curl:latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
    - >
      apk add --no-cache bash gettext jq >/dev/null &&
      bash /connectors/register-connectors.sh
    environment:
      CONNECT_URL: http://connect:8083
      LMS_DB_HOST: lms-postgres
      LMS_DB_PORT: "5432"
      LMS_DB_USER: ${LMS_DB_USER:-lms}
      LMS_DB_PASSWORD: ${LMS_DB_PASSWORD:-lms}
      LMS_DB_NAME: ${LMS_DB_NAME:-lms}
      LMS_TOPIC_PREFIX: ${LMS_TOPIC_PREFIX:-lms}
      DBZ_TABLE_INCLUDE_LIST: ${DBZ_TABLE_INCLUDE_LIST:-public.loan,public.loan_event,public.borrower}
      DBZ_SLOT_NAME: ${DBZ_SLOT_NAME:-lms_poc_debezium}
      DBZ_PUBLICATION_NAME: ${DBZ_PUBLICATION_NAME:-lms_poc_publication}
      ICEBERG_CATALOG_URI: ${ICEBERG_CATALOG_URI:-http://polaris:8181/api/catalog}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-lakehouse}
      ICEBERG_TABLES: ${ICEBERG_TABLES:-bronze.loan,bronze.loan_event,bronze.borrower}
      SINK_TOPICS_REGEX: ${SINK_TOPICS_REGEX:-lms.public.*}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_minio}
      MINIO_PATH_STYLE: ${MINIO_PATH_STYLE:-true}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      POLARIS_CREDENTIAL: ${POLARIS_CREDENTIAL:-root:CHANGE_ME_polaris_root}
      POLARIS_SCOPE: ${POLARIS_SCOPE:-PRINCIPAL_ROLE:ALL}
    volumes:
    - ./connectors:/connectors:ro
    depends_on:
      connect:
        condition: service_started
      minio:
        condition: service_started
      polaris-setup:
        condition: service_completed_successfully
    restart: "no"

  # ── Compute / transform / serve ────────────────────────────────────────────
  trino:
    restart: unless-stopped
    image: ${TRINO_IMAGE:-trinodb/trino:latest}
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7073:/opt/jmx/trino.yml"
      # Injected into etc/catalog/lakehouse.properties via ${ENV:...} (see
      # trino/catalog/README.md for the full env contract).
      POLARIS_URI: ${POLARIS_URI:-http://polaris:8181/api/catalog}
      POLARIS_WAREHOUSE: ${POLARIS_WAREHOUSE:-lakehouse}
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-CHANGE_ME_polaris_root}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-CHANGE_ME_minio}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    ports:
    - "8080:8080"
    mem_limit: 2048m
    cpus: 1.5
    volumes:
      # Filename = Trino catalog name: lakehouse.properties (Polaris REST catalog).
      # etc/catalog/postgres.properties (LMS) still TODO.
    - ./trino/catalog:/etc/trino/catalog:ro
    - ./demo:/demo:ro
    - ../monitoring/jmx:/opt/jmx:ro
    depends_on:
      minio:
        condition: service_started
      polaris:
        condition: service_started
      polaris-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Ad-hoc engine for the data-virtualization demo (profiles: demo).
  # Run it:  docker compose run --rm duckdb
  duckdb:
    restart: unless-stopped
    image: ${DUCKDB_IMAGE:-duckdb/duckdb:latest}
    profiles: ["demo"]
    volumes:
    - ./demo:/demo
    working_dir: /demo
    mem_limit: 512m
    cpus: 0.5

  # ── BI ─────────────────────────────────────────────────────────────────────
  metabase:
    restart: unless-stopped
    image: ${METABASE_IMAGE:-metabase/metabase:latest}
    environment:
      MB_JETTY_PORT: 3000
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TOOL_OPTIONS: "-Xmx1280m"
    ports:
      - "8085:3000"
    mem_limit: 2g
    cpus: 0.5
    volumes:
    - metabase_data:/metabase-data
    depends_on:
    - trino

  # ── Monitoring ─────────────────────────────────────────────────────────────
  node-exporter:
    restart: unless-stopped
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:latest}
    ports:
    - "9100:9100"
    mem_limit: 128m
    cpus: 0.25
    # TODO(Relay): add JMX exporters (Kafka, Connect, Trino, Polaris) as java
    # agents via JAVA_TOOL_OPTIONS on each JVM, plus MinIO + Postgres exporters.
    # Configs under monitoring/jmx/.

networks:
  default:
    name: lms-poc

volumes:
  lms_pg_data:
  polaris_pg_data:
  minio_data:
  kafka_data:
  connect_config:
  connect_data:
  connect_logs:
  metabase_data:
  prometheus_data:
  grafana_data:
