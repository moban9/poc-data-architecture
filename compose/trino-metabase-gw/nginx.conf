worker_processes 1;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    map $http_x_presto_user $trino_user {
        default $http_x_presto_user;
        ""      "metabase";
    }

    upstream trino_coordinator {
        server trino:8080;
        keepalive 16;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://trino_coordinator;
            proxy_http_version 1.1;
            proxy_set_header Connection "keep-alive";
            proxy_set_header Host $http_host;
            proxy_set_header X-Trino-User $trino_user;
            proxy_set_header X-Trino-Source "metabase";
            proxy_set_header X-Trino-Catalog $http_x_presto_catalog;
            proxy_set_header X-Trino-Schema $http_x_presto_schema;
        }
    }
}
