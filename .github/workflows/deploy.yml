name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      provider:
        description: "cloud provider"
        required: true
        default: "gcp"
        type: choice
        options: [gcp, aws]

permissions:
  contents: read
  id-token: write   # required for GCP Workload Identity Federation (OIDC)

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [terraform/gcp, terraform/aws]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt + validate
        working-directory: ${{ matrix.dir }}
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
      - name: compose config lint
        run: docker compose -f compose/docker-compose.yml config -q

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      # GCP — authenticate via Workload Identity Federation (no service-account key)
      - id: gcp-auth
        if: ${{ (inputs.provider || 'gcp') == 'gcp' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/445642900277/locations/global/workloadIdentityPools/hermes-poc-pool/providers/hermes-oidc'
          service_account: 'hermes-poc@project-955f419f-217d-449b-950.iam.gserviceaccount.com'

      - name: terraform apply (GCP)
        id: apply-gcp
        if: ${{ (inputs.provider || 'gcp') == 'gcp' }}
        working-directory: terraform/gcp
        env:
          TF_VAR_project_id: project-955f419f-217d-449b-950
          TF_VAR_region: asia-southeast2
          TF_VAR_zone: asia-southeast2-a
        run: |
          terraform init
          terraform apply -auto-approve
          echo "IP=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"

      - name: terraform apply (AWS)
        id: apply-aws
        if: ${{ (inputs.provider || 'gcp') == 'aws' }}
        working-directory: terraform/aws
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform init
          terraform apply -auto-approve
          echo "IP=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"

    outputs:
      ip: ${{ steps.apply-gcp.outputs.IP || steps.apply-aws.outputs.IP }}
