name: deploy

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "cloud provider"
        required: true
        default: "gcp"
        type: choice
        options: [gcp]

permissions:
  contents: read
  id-token: write   # GCP Workload Identity Federation (OIDC)
  issues: write     # auto-create incident tickets on failure

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt + validate
        working-directory: terraform/gcp
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
      - name: compose config lint (all files)
        run: |
          docker compose -f compose/docker-compose.yml -f compose/monitoring.yml -f compose/traefik.yml config -q

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/445642900277/locations/global/workloadIdentityPools/hermes-poc-pool/providers/hermes-oidc'
          service_account: 'hermes-poc@project-955f419f-217d-449b-950.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2

      - name: terraform apply (GCP)
        id: apply-gcp
        working-directory: terraform/gcp
        env:
          TF_VAR_project_id: project-955f419f-217d-449b-950
          TF_VAR_region: asia-southeast2
          TF_VAR_zone: asia-southeast2-a
        run: |
          terraform init
          terraform apply -auto-approve
          echo "lb_ip=$(terraform output -raw load_balancer_ip)" >> "$GITHUB_OUTPUT"

      - name: deploy stack (clone + compose up over SSH)
        run: |
          set -euo pipefail
          VM_NAME="lms-poc-vm"     # ${var.name}-vm (var.name default = lms-poc)
          ZONE="asia-southeast2-a"
          SSH_FLAGS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          # wait for SSH to come up (startup script installs docker + envsubst)
          for i in $(seq 1 20); do
            if gcloud compute ssh "ubuntu@${VM_NAME}" --zone="$ZONE" --quiet \
                 --ssh-flag="${SSH_FLAGS[0]}" --ssh-flag="${SSH_FLAGS[1]}" \
                 --command="command -v docker >/dev/null && echo ready" 2>/dev/null | grep -q ready; then
              echo "VM ready"; break
            fi
            sleep 15
          done
          gcloud compute ssh "ubuntu@${VM_NAME}" --zone="$ZONE" --quiet \
            --ssh-flag="${SSH_FLAGS[0]}" --ssh-flag="${SSH_FLAGS[1]}" \
            --command="rm -rf /home/ubuntu/poc && git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/moban9/poc-data-architecture.git /home/ubuntu/poc"
          gcloud compute ssh "ubuntu@${VM_NAME}" --zone="$ZONE" --quiet \
            --ssh-flag="${SSH_FLAGS[0]}" --ssh-flag="${SSH_FLAGS[1]}" \
            --command="cd /home/ubuntu/poc/compose && docker compose -f docker-compose.yml -f monitoring.yml -f traefik.yml up -d --pull always"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: report endpoints
        run: |
          echo "LB IP (point DNS A records here): ${{ steps.apply-gcp.outputs.lb_ip }}"
          echo "https://grafana.onendo.cloud"
          echo "https://demo.onendo.cloud"
          echo "https://bi.onendo.cloud"
          echo "https://plane.onendo.cloud"

      - name: Create incident ticket
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const url = `${context.payload.repository.html_url}/actions/runs/${runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[INCIDENT] POC deploy failed — run ${runId}`,
              body: `Deploy workflow failed.\nRun: ${url}\n\nInvestigate, remediate, then close this ticket.`
            });
