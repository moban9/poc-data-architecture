name: vm-control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "start or stop the POC VM"
        required: true
        type: choice
        options: [start, stop]

permissions:
  contents: read
  id-token: write

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/445642900277/locations/global/workloadIdentityPools/hermes-poc-pool/providers/hermes-oidc'
          service_account: 'hermes-poc@project-955f419f-217d-449b-950.iam.gserviceaccount.com'
      - uses: google-github-actions/setup-gcloud@v2
      - name: "${{ inputs.action }} VM"
        run: gcloud compute instances ${{ inputs.action }} lms-poc-vm --zone asia-southeast2-a --quiet
      - name: "Capture VM IP"
        if: inputs.action == 'start'
        run: |
          gcloud compute instances describe lms-poc-vm --zone asia-southeast2-a \
            --format="value(status, networkInterfaces[0].accessConfigs[0].natIP)"
