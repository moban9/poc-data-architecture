name: vm-remote-exec

on:
  workflow_dispatch:
    inputs:
      command:
        description: "shell command to run on the POC VM"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  exec:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/445642900277/locations/global/workloadIdentityPools/hermes-poc-pool/providers/hermes-oidc'
          service_account: 'hermes-poc@project-955f419f-217d-449b-950.iam.gserviceaccount.com'
      - uses: google-github-actions/setup-gcloud@v2
      - name: Run command on VM
        run: |
          gcloud compute ssh lms-poc-vm --zone asia-southeast2-a --quiet --command "${{ inputs.command }}"
