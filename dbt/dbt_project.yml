name: 'lms_poc'
version: '1.0.0'
config-version: 2

# Profile name must match an entry in profiles.yml (see profiles.yml.example).
profile: 'lms_poc'

# After every invocation (run/test/build), append any FAILING test's offending
# rows to lakehouse.quarantine_lms (reactive backstop to the proactive per-rule
# quarantine models). The test still fails the run — schema.yml is the assert
# gate that blocks downstream.
on-run-end: "{{ quarantine_failed_tests(results) }}"

model-paths: ["models"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# ── Models ────────────────────────────────────────────────────────────────
# Custom schemas map to exact lakehouse schema names via the
# generate_schema_name macro in macros/generate_schema_name.sql
# (silver -> "silver", gold -> "gold", lakehouse -> "lakehouse").
models:
  lms_poc:
    +materialized: table
    # Trino's Iceberg connector supports CREATE OR REPLACE (Trino >= 431);
    # the default `rename` strategy (__dbt_backup swap) fails to drop the backup
    # table against the Polaris Iceberg REST catalog. `replace` is atomic and
    # re-run safe.
    +on_table_exists: replace
    silver:
      +schema: silver
    gold:
      +schema: gold

# ── Seeds ─────────────────────────────────────────────────────────────────
seeds:
  lms_poc:
    +schema: bronze
    +quote_columns: false
