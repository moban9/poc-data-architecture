version: 2

# ── Silver data-quality rules (the POC test suite) ────────────────────────
# Built-in tests used: not_null, unique, relationships, accepted_values.
# Custom generic tests used: positive_value (macros/positive_value.sql),
# valid_date (macros/valid_date.sql).
#
# These are the ASSERT GATE: a failing test blocks downstream (dbt test exits
# non-zero, and the on-run-end hook appends the offending rows to
# lakehouse.quarantine_lms). In the happy path the clean Silver models already
# exclude bad rows (see models/silver/quarantine/*), so these tests pass.

models:
  - name: loan
    description: >
      Silver staging of the LMS `loan` table (from the Bronze CDC append-only
      stream). Enforced by the data-quality rules below.
    columns:
      - name: id
        description: "Loan identifier (primary key)."
        tests:
          - not_null
          - unique
      - name: amount
        description: "Loan principal amount. Must be strictly positive (> 0)."
        tests:
          - positive_value
      - name: currency
        description: "ISO 4217 currency code."
        tests:
          - not_null
          - accepted_values:
              values: ["USD", "EUR", "GBP", "JPY", "CAD", "AUD"]
              quote: true
      - name: origination_date
        description: "Date the loan was originated (YYYY-MM-DD)."
        tests:
          - not_null
          - valid_date
      - name: borrower_id
        description: "Foreign key to dim_borrower."
        tests:
          - not_null
          - relationships:
              to: ref('dim_borrower')
              field: id

  - name: loan_event
    description: "Silver staging of the LMS `loan_event` CDC stream."
    columns:
      - name: id
        description: "Event identifier (primary key)."
        tests:
          - not_null
          - unique
      - name: loan_id
        description: "Foreign key to loan."
        tests:
          - not_null
          - relationships:
              to: ref('loan')
              field: id
      - name: event_type
        description: "Event type code."
        tests:
          - not_null
      - name: occurred_at
        description: "Event timestamp."
        tests:
          - not_null

  - name: dim_borrower
    description: "Borrower dimension (one row per borrower)."
    columns:
      - name: id
        description: "Borrower identifier (primary key)."
        tests:
          - not_null
          - unique

  # ── Gold models ──────────────────────────────────────────────────────────
  - name: loan_portfolio
    description: "Gold: loan portfolio roll-up by currency."
    columns:
      - name: currency
        description: "ISO 4217 currency code."
        tests:
          - not_null
      - name: loan_count
        description: "Number of clean loans in this currency."
        tests:
          - positive_value

  - name: loan_origination_daily
    description: "Gold: daily loan origination volume."
    columns:
      - name: origination_date
        description: "Date the loans were originated (YYYY-MM-DD)."
        tests:
          - not_null
          - valid_date
      - name: loan_count
        description: "Number of clean loans originated that day."
        tests:
          - positive_value

  - name: loan_event_summary
    description: "Gold: loan event activity by event type."
    columns:
      - name: event_type
        description: "Event type code (origination/disbursement/payment)."
        tests:
          - not_null
      - name: event_count
        description: "Number of events of this type."
        tests:
          - positive_value
