version: 2

# ── Silver data-quality rules (the POC test suite) ────────────────────────
# Built-in tests used: not_null, unique, relationships, accepted_values.
# Custom generic tests used: positive_value (macros/positive_value.sql),
# valid_date (macros/valid_date.sql).
#
# These are the ASSERT GATE: a failing test blocks downstream (dbt test exits
# non-zero, and the on-run-end hook appends the offending rows to
# lakehouse.quarantine_lms). In the happy path the clean Silver models already
# exclude bad rows (see models/silver/quarantine/*), so these tests pass.

models:
  - name: loan
    description: >
      Silver staging of the LMS `loan` table (from the Bronze CDC append-only
      stream). Enforced by the data-quality rules below.
    columns:
      - name: id
        description: "Loan identifier (primary key)."
        tests:
          - not_null
          - unique
      - name: amount
        description: "Loan principal amount. Must be strictly positive (> 0)."
        tests:
          - positive_value
      - name: currency
        description: "ISO 4217 currency code."
        tests:
          - not_null
          - accepted_values:
              values: ["USD", "EUR", "GBP", "JPY", "CAD", "AUD"]
              quote: true
      - name: origination_date
        description: "Date the loan was originated (YYYY-MM-DD)."
        tests:
          - not_null
          - valid_date
      - name: borrower_id
        description: "Foreign key to dim_borrower."
        tests:
          - not_null
          - relationships:
              to: ref('dim_borrower')
              field: id
      - name: term_months
        description: "Loan term in months (variable, default 12)."
        tests:
          - not_null
          - positive_value
      - name: disbursement_date
        description: "Date the loan was disbursed (YYYY-MM-DD)."
        tests:
          - not_null
          - valid_date
      - name: interest_rate
        description: "Annual interest rate in percent (e.g. 12.00 = 12%)."
        tests:
          - not_null
      - name: monthly_installment
        description: "Equal monthly annuity (PMT) for the amortizing schedule."
        tests:
          - not_null
          - positive_value
      - name: maturity_date
        description: "Final contractual due date (YYYY-MM-DD)."
        tests:
          - not_null
          - valid_date

  - name: loan_event
    description: >
      Silver staging of the LMS `loan_event` CDC stream (deduped to one row per
      id, then DQ-filtered: NULL loan_id and events belonging to loans that
      failed loan DQ are excluded — see the model header).
    columns:
      - name: id
        description: "Event identifier (primary key)."
        tests:
          - not_null
          - unique
      - name: loan_id
        description: "Foreign key to loan."
        tests:
          - not_null
          - relationships:
              to: ref('loan')
              field: id
      - name: event_type
        description: "Event type code."
        tests:
          - not_null
      - name: amount
        description: "Event amount (NULL for origination)."
      - name: occurred_at
        description: "Event timestamp."
        tests:
          - not_null

  - name: dim_borrower
    description: "Borrower dimension (one row per borrower)."
    columns:
      - name: id
        description: "Borrower identifier (primary key)."
        tests:
          - not_null
          - unique

  - name: repayment_schedule
    description: >
      Silver staging of the LMS `repayment_schedule` table — one row per
      instalment (installment_no, due_date, principal_due, interest_due, status).
      Business key is (loan_id, installment_no), enforced in the source.
    columns:
      - name: id
        description: "Instalment identifier (primary key)."
        tests:
          - not_null
          - unique
      - name: loan_id
        description: "Foreign key to loan."
        tests:
          - not_null
          - relationships:
              to: ref('loan')
              field: id
      - name: currency
        description: "ISO 4217 currency code of the parent loan (denormalized via loan_id)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["USD", "EUR", "GBP", "JPY", "CAD", "AUD"]
                quote: true
      - name: installment_no
        description: "1-based instalment number within the loan's schedule."
        tests:
          - not_null
      - name: due_date
        description: "Contractual due date of this instalment (YYYY-MM-DD)."
        tests:
          - not_null
          - valid_date
      - name: principal_due
        description: "Principal portion due on this instalment."
        tests:
          - not_null
      - name: interest_due
        description: "Interest portion due on this instalment."
        tests:
          - not_null
      - name: status
        description: "scheduled (future) / paid / overdue (past due date, unpaid)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["scheduled", "paid", "overdue"]
                quote: true

  # ── Gold models ──────────────────────────────────────────────────────────
  - name: loan_portfolio_summary
    description: "Gold: loan portfolio summary grouped by derived loan_status, loan_type and currency."
    columns:
      - name: loan_status
        description: "Derived lifecycle status: originated / disbursed / repaying."
        tests:
          - not_null
      - name: loan_type
        description: "Derived principal-size tier: micro / small / medium / large."
        tests:
          - not_null
      - name: currency
        description: "ISO 4217 currency code — the money grain is per-currency (no FX)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["USD", "EUR", "GBP", "JPY", "CAD", "AUD"]
                quote: true
      - name: loan_count
        description: "Number of clean loans in the group."
      - name: total_principal
        description: "Sum of principal across the group."
      - name: avg_amount
        description: "Average principal across the group."
      - name: outstanding_balance
        description: "Principal outstanding (principal - payments received), floored at 0."

  - name: loan_delinquency
    description: >
      Gold: disbursed loans bucketed by days past due (current / 30-59 / 60-89 /
      90+), with a real portfolio-level NPL rate = 90+ outstanding / total
      outstanding. Days-past-due is derived from the real repayment_schedule
      (as_of - oldest overdue due_date), not a 365-day term assumption — see the
      model's derivation note.
    columns:
      - name: delinquency_bucket
        description: "current / 30-59 / 60-89 / 90+ (days past due)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["current", "30-59", "60-89", "90+"]
                quote: true
          - unique
      - name: loan_count
        description: "Number of disbursed loans in the bucket."
        tests:
          - not_null
      - name: outstanding_balance
        description: "Outstanding balance of loans in the bucket (floored at 0)."
        tests:
          - not_null
      - name: npl_rate
        description: >
          Portfolio NPL rate = 90+ outstanding / total outstanding; identical on
          every row (portfolio-level KPI).
        tests:
          - not_null

  - name: loan_event_daily
    description: "Gold: daily loan event rollup (counts and amounts per calendar day, per currency)."
    tests:
      - unique_combination:
          combination:
            - event_date
            - currency
    columns:
      - name: event_date
        description: "Calendar day of the events."
        tests:
          - not_null
      - name: currency
        description: "ISO 4217 currency code — the money grain is per-currency (no FX)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["USD", "EUR", "GBP", "JPY", "CAD", "AUD"]
                quote: true
      - name: total_events
        description: "Total events that day."
      - name: origination_count
        description: "Origination events that day."
      - name: disbursement_count
        description: "Disbursement events that day."
      - name: payment_count
        description: "Payment events that day."
      - name: disbursement_amount
        description: "Total disbursed amount that day."
      - name: payment_amount
        description: "Total payment amount that day."

  - name: loan_delinquency_snapshot
    description: >-
      Gold: append-only history of delinquency buckets (current / 30-59 / 60-89
      / 90+), one row per (as_of_date, delinquency_bucket) with a real portfolio
      NPL rate. Materialized incremental (append, no unique_key) — each dbt run
      inserts the current snapshot and never drops prior dates, so the NPL-rate
      trend over time is real (no synthesized history). See the model header for
      the as_of_date / dedup contract.
    columns:
      - name: as_of_date
        description: "Snapshot date = max(loan_event.occurred_at)::date (the dataset's 'now')."
        tests:
          - not_null
      - name: delinquency_bucket
        description: "current / 30-59 / 60-89 / 90+ (days past due)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["current", "30-59", "60-89", "90+"]
                quote: true
      - name: loan_count
        description: "Number of disbursed loans in the bucket at this snapshot date."
        tests:
          - not_null
      - name: outstanding_balance
        description: "Outstanding balance of loans in the bucket (floored at 0); nominal, multi-currency."
        tests:
          - not_null
      - name: npl_rate
        description: >-
          Portfolio NPL rate = 90+ outstanding / total outstanding at this
          snapshot date; identical on every bucket row for the same date.
        tests:
          - not_null
